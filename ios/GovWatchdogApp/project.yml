# XcodeGen spec — source of truth for GovWatchdogApp.xcodeproj
# (GOV-1537 / GOV-1523 Phase 4c leg 1)
#
# Regenerate the project after editing this file:
#   cd ios/GovWatchdogApp && xcodegen generate
#
# The generated .xcodeproj is committed so a fresh clone with only Xcode can build
# without installing XcodeGen; edit THIS file (not the pbxproj) for structural
# changes, then regenerate and commit both.

name: GovWatchdogApp
options:
  bundleIdPrefix: com.isaac4alpine
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Keep generated output free of per-user scheme/state noise.
  xcodeVersion: "26.0"

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Simulator builds need no code signing; on-device signing is leg 4c-6.
    CODE_SIGN_STYLE: Automatic

targets:
  GovWatchdogApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources
      - path: Resources
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.isaac4alpine.govwatchdog
        PRODUCT_NAME: GovWatchdogApp
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        ENABLE_USER_SCRIPT_SANDBOXING: YES
      configs:
        # Per-config Info.plist selection (set here, not in .xcconfig, because
        # XcodeGen writes INFOPLIST_FILE into the target and that would override an
        # xcconfig value). Debug adds NSAllowsLocalNetworking for the loopback e2e
        # stack; Release carries no ATS keys at all (full ATS, spec §2 item 7).
        Debug:
          INFOPLIST_FILE: Resources/Info-Debug.plist
        Release:
          INFOPLIST_FILE: Resources/Info.plist
