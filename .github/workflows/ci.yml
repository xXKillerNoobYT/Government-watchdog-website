name: Website CI

# Reviewer-internal/local frontend. Runs on the self-hosted GOV website runner.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build
        run: npm run build
