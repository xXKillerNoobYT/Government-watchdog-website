name: Website CI

# Reviewer-internal/local frontend. Runs on the self-hosted GOV website runner.
# push+pull_request on ["**"] ran every PR push TWICE, concurrently, on one
# physical machine — doubling runner load and producing the #59 timeout-flake
# family (one twin green, one red on the same sha). PR branches now run once.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# #110 (owner-approved 2026-07-30): one global group serializes EVERY run of this
# workflow, because the remaining #59-family race is cross-ref — main's post-merge
# run overlapping a different PR's run on the one physical runner (measured:
# 20560ms vs the 20000ms ceiling, same sha passing once the queue drained).
# cancel-in-progress stays false so a running suite always finishes; the known
# trade is that GitHub keeps at most ONE pending run per group, so a queued PR
# run can be replaced while waiting. That failure is visible-and-restartable
# (a cancelled check), unlike the load flake it replaces (a red that looks like
# a code failure). Explicitly NOT a third testTimeout raise — see #110.
concurrency:
  group: website-ci-runner
  cancel-in-progress: false

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-website]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      - name: Integration smoke — 5 assertions (raw-path / label / link / rollup / cycle)
        run: npm run test:smoke

      - name: Public + private-beta production builds
        run: npm run build:all

      - name: Public downloadable-asset safety boundary
        run: npm run check:public-bundle
