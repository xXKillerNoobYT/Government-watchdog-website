name: Website CI

# Reviewer-internal/local frontend. Public repo, so GitHub-hosted minutes are
# free. typecheck · test · build runs on ubuntu-latest: the self-hosted Mac
# (self-hosted, macOS, ARM64, government-watchdog, gov-website) is offline and
# left every PR queued. None of these steps need macOS — checkout, npm ci,
# tsc, vitest, and the lane builds are Node-only — so there is no companion
# self-hosted job (it would sit queued on the same offline runner). The one
# Mac filesystem assumption is /private/tmp (mkdtemp in the #291 denial
# test); the job creates that directory before the suite.
#
# push+pull_request on ["**"] ran every PR push TWICE, concurrently, on one
# physical machine — doubling runner load and producing the #59 timeout-flake
# family (one twin green, one red on the same sha). PR branches now run once.
on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

# #110 serialized every run in one global group because two jobs on the one
# physical Mac raced. Hosted runners do not share that machine, and a run
# stuck in the self-hosted queue must not keep the group (GitHub retains one
# pending run per group). Each ref has its own group now. cancel-in-progress
# stays false so a running suite always finishes.
concurrency:
  group: website-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The Mac runner had Node on PATH already. This repo has no engines
      # field, .nvmrc, or packageManager pin; dependencies accept
      # ^18 || ^20 || >=22, and ubuntu-latest ships Node 22. Pin that major
      # and cache the npm download directory from package-lock.json.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # macOS has /private/tmp (/tmp is a symlink to it). The #291 denial
      # test mkdtemp's there, outside os.tmpdir(), and does not create the
      # parent. Ubuntu has /tmp only.
      - name: Provide macOS /private/tmp
        run: sudo mkdir -p /private/tmp && sudo chmod 1777 /private/tmp

      - name: Install dependencies (clean, from lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (vitest)
        run: npm test

      # GOV-105: the dedicated `npm run test:smoke` step was removed here — `npm test`
      # (vitest run) already matches test/integration-smoke.test.ts, and the file's own
      # header says so. Measured 1.1s of a duplicated ~70-module jsdom boot.
      #
      # The other two duplications in that issue are KEPT, deliberately, and measured:
      #   * the standalone `npm run typecheck` step is 2.1s and fails BEFORE the 11.1s
      #     suite. Removing it would surface a type error ~13s later, inside build:all.
      #   * `build:public` and `build:private-beta` each run `tsc --noEmit` inline. That
      #     is not waste: each lane script must be independently safe when run alone, so
      #     `npm run build:public` on its own can never emit from broken types.
      # Total real saving is ~1.1s of a ~70-90s job; the issue's premise that work is
      # duplicated is correct, its implicit premise that all three are waste is not.

      - name: Public + private-beta production builds
        run: npm run build:all

      - name: Public downloadable-asset safety boundary
        run: npm run check:public-bundle

      # The combined build above proves lane isolation but deliberately leaves
      # both browser artifacts under dist/. Execute the actual Sites default as
      # a separate final shape check so CI verifies exactly what can be saved.
      - name: Sites deployable public-free package
        run: npm run build
