name: Post-Merge Worktree Cleanup (Dry-Run)

# GOV-215: event-driven trigger for the post-merge cleanup script.
# Fires after every push to the default branch (which is the moment a PR merges
# on GitHub). The cleanup script lives in the Backend repo and auto-discovers
# both checkouts via KNOWN_REPO_ROOTS, so this Website workflow simply invokes
# the script at its absolute path on the shared self-hosted Mac runner.
#
# Why dry-run only:
#   The CTO_WORKFLOWS hard stop forbids `--apply` automation without a
#   CEO-approved plan. The cadence-driven Paperclip routine 804d7f7c is the
#   gated lane that performs `--apply` after the AutomationOpsEngineer
#   reviews dry-run output.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: post-merge-cleanup
  cancel-in-progress: false

jobs:
  dry-run:
    name: Dry-run merged-branch / worktree sweep (cross-repo via Backend script)
    runs-on: [self-hosted, macOS, ARM64, government-watchdog, gov-website]
    steps:
      - name: Mask private runner paths
        run: |
          mask_path() {
            value="$1"
            [ -n "$value" ] || return 0
            echo "::add-mask::$value"
            escaped="${value//\//\\/}"
            echo "::add-mask::$escaped"
          }
          mask_path "$HOME"
          mask_path "$GITHUB_WORKSPACE"
          mask_path "$RUNNER_TEMP"
          mask_path "${RUNNER_WORKSPACE:-}"

      - name: Checkout (keep this repo's state current on the runner)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve Paperclip API URL
        id: api
        run: |
          echo "url=${PAPERCLIP_API_URL:-http://127.0.0.1:3100}" >> "$GITHUB_OUTPUT"

      - name: Run cleanup script (dry-run, JSON)
        id: sweep
        run: |
          set -u
          # Resolve and consume the private backend path inside this one shell.
          # Never persist it through GITHUB_ENV: Actions prints persisted values
          # in every later step's environment block.
          rel="scripts/cleanup_merged_worktrees.py"
          checkout="${GW_BACKEND_CHECKOUT:-$HOME/Code/Government-watchdog}"
          script="$checkout/$rel"
          echo "::add-mask::$checkout"
          echo "::add-mask::$script"
          if [ ! -f "$script" ]; then
            echo "::error::Cleanup script not found at <backend-checkout>/$rel — set GW_BACKEND_CHECKOUT on the runner"
            exit 1
          fi
          echo "script_rel=$rel" >> "$GITHUB_OUTPUT"

          mkdir -p Logs
          ts="$(date -u +%Y%m%dT%H%M%SZ)"
          out="Logs/post-merge-cleanup-${ts}.json"
          err="Logs/post-merge-cleanup-${ts}.stderr"
          if ! python3 "$script" \
              --api-url "${{ steps.api.outputs.url }}" \
              --json >"$out" 2>"$err"; then
            rm -f "$out" "$err"
            echo "::error::Cleanup dry-run failed; raw output withheld."
            exit 1
          fi
          rm -f "$err"

          if ! node scripts/prepare-cleanup-report.mjs "$out"; then
            rm -f "$out"
            echo "::error::Cleanup report validation failed; raw output withheld."
            exit 1
          fi
          echo "::notice::Raw cleanup report withheld; aggregate-only artifact prepared."

      - name: Summarise to GitHub step summary
        if: always()
        run: |
          {
            echo "## Post-Merge Cleanup — Dry-Run (cross-repo)"
            echo ""
            echo "Trigger: \`${{ github.event_name }}\` on \`${{ github.ref }}\`"
            echo "Script:  \`${{ steps.sweep.outputs.script_rel }}\` in the runner backend checkout"
            echo "Mode:    dry-run (no removals — \`--apply\` is gated on the Paperclip daily routine 804d7f7c)"
            echo ""
            if [ "${{ steps.sweep.outputs.report_status }}" != "" ]; then
              echo "### Candidates"
              echo "- candidates: ${{ steps.sweep.outputs.total_candidates }}"
              echo "- would remove branches: ${{ steps.sweep.outputs.would_remove_branches }}"
              echo "- would remove worktrees: ${{ steps.sweep.outputs.would_remove_worktrees }}"
              echo "- preserved: ${{ steps.sweep.outputs.preserved_count }}"
              echo "- failed: ${{ steps.sweep.outputs.failed_count }}"
              if [ "${{ steps.sweep.outputs.report_status }}" = "aggregate-only" ]; then
                echo "- raw JSON artifact: withheld (aggregate-only public artifact)"
              fi
            else
              echo "(no validated JSON report produced — see job log)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate-only dry-run summary
        if: always() && steps.sweep.outputs.artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: post-merge-cleanup-dry-run-summary
          path: ${{ steps.sweep.outputs.artifact }}
          if-no-files-found: warn
          retention-days: 14
